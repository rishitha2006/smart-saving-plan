<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | Smart Saving Plan</title><link rel="stylesheet" href="/css/app.css"></head>
<body class="auth-page"><div class="auth-shell">
<div class="auth-brand">Smart<span>Saving Plan</span></div><div class="auth-card">
<a class="back" href="/">← Back to home</a>
<div class="form-head"><div class="icon-bubble">↗</div><h1>Welcome back</h1><p>Sign in and continue your personal financial plan.</p></div>
<div th:if="${message}" class="alert success" th:text="${message}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div>
<form action="/login" method="post">
<label>Email or username<input name="login" type="text" placeholder="Enter email or username" required></label>
<label>Password<input name="password" type="password" placeholder="Enter password" required></label>
<button class="btn primary full" type="submit">Sign in →</button>
</form><p class="switch">New to Smart Saving Plan? <a href="/signup">Create an account</a></p>
</div></div><script src="/js/app.js"></script></body></html>

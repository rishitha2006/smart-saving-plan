<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Something went wrong | Smart Saving Plan</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
<main class="auth-shell">
  <div class="auth-brand">Smart<span>Saving Plan</span></div>
  <section class="auth-card error-screen">
    <div class="icon-bubble">!</div>
    <div class="form-head">
      <h1>We couldn't complete that</h1>
      <p>Something went wrong while processing your request. Your account data was not intentionally changed.</p>
    </div>
    <div class="alert error">Please go back and try again. If the problem continues, return to the dashboard or sign in again.</div>
    <div class="error-actions">
      <a class="btn primary" href="/dashboard">Go to dashboard</a>
      <a class="btn ghost" href="/">Back to home</a>
    </div>
  </section>
</main>
</body>
</html>
